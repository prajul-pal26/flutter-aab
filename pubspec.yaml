name: quality
description: "Quality - Field Survey and Quality Verification Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6
  record: ^5.2.1
  path_provider: ^2.1.3
  geolocator: ^12.0.0
  sqflite: ^2.3.3+1
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/up_75_districts_403_acs.json
    - assets/questions.json
    - assets/up_assembly_ac.geojson

dependency_overrides:
  record_linux: ^2.1.3
  record_platform_interface: ^2.1.0
